name: Moodle Plugin CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.0', '8.1']
        moodle-branch: ['MOODLE_401_STABLE']
        database: [mariadb]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      # N2NCU 2026-08-03: the local_vflibs clone step is gone, along with the
      # --extra-plugins ./plugin-deps it fed. Nothing in this plugin calls into
      # local_vflibs any more - the reports chart uses \core\chart_line - so the
      # step was cloning 214MB per run to satisfy a dependency version.php no
      # longer declares. --extra-plugins is dropped rather than left pointing at
      # an empty plugin-deps, which moodle-plugin-ci treats as an error.
      #
      # Only on n2ncu-405. The 4.1 branch still declares the dependency because
      # the chart port has not been carried across, so its CI still needs this.
      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci codechecker

      - name: Moodle PHPDoc Checker
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        # Advisory, matching phpmd / codechecker / phpdoc above. Its remaining
        # output is style convention, not defects: most "HTML Validation error"
        # warnings are artefacts of linting fragment templates as standalone
        # documents (editlink.mustache is a bare <tr>...</tr> meant to render
        # inside a table built elsewhere, so <tr> with no <table> reads as a
        # "stray tag"), and the "Example context missing" warnings are because
        # this plugin has never shipped .json example contexts for any of its
        # 19 templates.
        #
        # The output stays visible, so a genuine syntax error still shows up -
        # one did: searchqueries.mustache opened {{#str}} and closed {{/Str}},
        # which was found only once CI started linting this plugin instead of
        # local_vflibs, and is fixed.
        continue-on-error: true
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: PHPUnit tests
        if: ${{ always() }}
        run: moodle-plugin-ci phpunit

      - name: Behat features
        if: ${{ always() }}
        run: moodle-plugin-ci behat --profile chrome
